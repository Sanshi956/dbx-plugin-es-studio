name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    # Official DBX reusable workflow, pinned to the same CLI tag used locally.
    # It builds one unsigned candidate per target, validates artifact metadata
    # and uploads the .dbxp files + release-candidates.json to this Release.
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.10
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: npm ci && npm run build && dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: "0.1.10"
      go-version: "1.22.x"
      # Go backend only; no Rust toolchain or source-built CLI needed.
      rust-toolchain: ""
