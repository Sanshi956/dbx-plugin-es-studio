<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ES Studio</title>
    <!--
      DBX serves plugin UI as a single HTML document inside an opaque-origin
      iframe. External ./assets/*.js cannot be resolved there, so the build
      inlines everything (see vite.config.js). This static boot marker stays
      in the HTML itself: if it remains visible, the document loaded but the
      application script did not run - never an unexplained blank page.
    -->
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--dbx-bg, #f6f8fa);
        color: var(--dbx-text, #1f2328);
        font: 13px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #es-boot {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100vh;
        text-align: left;
      }
      #es-boot .mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--dbx-accent, #2563eb);
        color: #fff;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      #es-boot strong { display: block; font-size: 15px; }
      #es-boot small { display: block; opacity: 0.7; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="es-boot">
        <span class="mark">ES</span>
        <div><strong>ES Studio</strong><small>Starting workbench…</small></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
